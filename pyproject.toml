[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-ui"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
]

[project.optional-dependencies]
# Pillow is not a runtime dependency: shared_ui.icons_pil is imported only by
# the players, which already have it, and nothing here imports Qt and Pillow at
# once. The suite needs it to check the two renderers draw the same marks.
dev = ["pytest", "vulture", "pillow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shared_ui*"]
namespaces = false
