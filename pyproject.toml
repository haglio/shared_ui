[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-ui"
# The version is the tag on the landing, read by setuptools-scm, so the three
# repos that run this one can name the copy they were built against. Written
# down it said 0.1.0 for the life of the repo.
dynamic = ["version"]
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# Qt is an extra: `spacing` is
# plain integers and `icons_pil` draws with Pillow alone, and those two modules
# are the whole of what funestra imports from here -- so an unconditional
# PyQt6 put a Qt wheel in every Funestra venv and on every runner that installs
# one, for code that never touches it. Every consumer that uses the widgets
# declares PyQt6 itself, and its own import gate says so.
#
# app_support is not among these: every app pins it itself, and pip refuses two
# pins of one repo that differ, so a pin here held every app to this repo's copy
# until this repo released again. The copy this repo's own suite runs is named in
# the dev extra, never left to whatever checkout sits beside it.
dependencies = [
    # The loading screen draws its panel with it, in the app's process and in the
    # loading window's own.
    "pillow>=12,<13",
]

# The version is `git describe` of the checkout being built: a landing's tag
# exactly, and that tag plus a development suffix for a checkout past one.
[tool.setuptools_scm]

[project.optional-dependencies]
# Every requirement carries a ceiling: without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# the machine holds today.
qt = ["PyQt6>=6,<7"]
# The suite needs Qt, which is most of this package.
dev = ["app-support @ git+https://github.com/haglio/app_support@v0.1.329",
       "pytest>=9,<10", "pytest-cov>=7,<8", "pytest-timeout>=2.4,<3", "vulture>=2.16,<3",
       "ruff==0.16.6", "PyQt6>=6,<7"]

[tool.pytest.ini_options]
# The content guard's enforcement check, taken from app_support rather than
# kept here as a copy: no tracked file may carry a blocklisted term. A `-p`
# that cannot be imported is a hard failure with no tests run, which is the
# answer wanted -- a checkout that has stopped being guarded must not look
# like a green one.
#
# The timeout is a ceiling on a hang, not a performance budget. The slowest
# test on a developer machine is the tracked-tree content scan, but it is not
# the slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the collection-order probe, which spawns a pytest child, at
# about a third of a second. --timeout-method=thread is the half that pays for
# itself: it dumps the stack of the test that stopped, which turns a stalled
# required check into a one-line diagnosis. app_support.gates holds all
# three halves of it.
addopts = "-p app_support.sanitize.pytest_plugin -p app_support.gates.pytest_plugin -p app_support.coverage_gate --cov --cov-report= --timeout=60 --timeout-method=thread"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shared_ui*"]
namespaces = false

# The family checkouts this one is installed beside. They cannot go in
# [project.dependencies] -- neither is published, so pip would look for them on
# PyPI -- and a comment is what decayed everywhere else in the family, so this is
# the record instead. The family's dependency gate holds it against the tree.
[tool.haglio]
siblings = ["app_support"]
