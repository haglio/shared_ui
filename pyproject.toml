[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-ui"
version = "0.1.0"
# 3.12, not 3.10: every gate in the family runs 3.12 and nothing has ever
# collected a suite on anything older, so >=3.10 was a promise no run backed.
requires-python = ">=3.12"
# Qt is an extra, for the reason already written below about Pillow: `spacing` is
# plain integers and `icons_pil` draws with Pillow alone, and those two modules
# are the whole of what player_core imports from here -- so an unconditional
# PyQt6 put a Qt wheel in every player venv and on every runner that installs
# one, for code that never touches it. Every consumer that uses the widgets
# declares PyQt6 itself, and its own import gate says so.
dependencies = []

[project.optional-dependencies]
# Every requirement carries a ceiling: without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# the machine holds today.
qt = ["PyQt6>=6,<7"]
# Pillow is not a runtime dependency: shared_ui.icons_pil is imported only by
# the players, which already have it, and nothing here imports Qt and Pillow at
# once. The suite needs it to check the two renderers draw the same marks -- and
# it needs Qt, which is most of this package.
dev = ["pytest>=9,<10", "pytest-timeout>=2.4,<3", "vulture>=2.16,<3", "pillow>=12,<13",
       "ruff==0.16.6", "PyQt6>=6,<7"]

[tool.pytest.ini_options]
# The content guard's enforcement check, taken from app_support rather than
# kept here as a copy: no tracked file may carry a blocklisted term. A `-p`
# that cannot be imported is a hard failure with no tests run, which is the
# answer wanted -- a checkout that has stopped being guarded must not look
# like a green one.
#
# The timeout is a ceiling on a hang, not a performance budget. The slowest
# test on a developer machine is the tracked-tree content scan, but it is not
# the slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the collection-order probe, which spawns a pytest child, at
# about a third of a second. --timeout-method=thread is the half that pays for
# itself: it dumps the stack of the test that stopped, which turns a stalled
# required check into a one-line diagnosis. tests/test_timeouts.py holds all
# three halves of it.
addopts = "-p app_support.sanitize.pytest_plugin --timeout=60 --timeout-method=thread"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shared_ui*"]
namespaces = false

# The family checkouts this one is installed beside. They cannot go in
# [project.dependencies] -- neither is published, so pip would look for them on
# PyPI -- and a comment is what decayed everywhere else in the family, so this is
# the record instead. tests/test_dependencies.py holds it against the tree.
[tool.haglio]
siblings = ["app_support"]
