line-length = 100
target-version = "py312"

[lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "DTZ", "PIE", "PERF", "FLY", "ISC", "RET", "FURB", "EXE"]
ignore = ["E501", "BLE001", "S110",
    # This repo's ratchet: each rule the family config still finds here, and its places today.
    "PLR2004",  # 12
    "PT018",  # 20
    "PLR0913",  # 8
    "PLR0912",  # 2
    "PLR0917",  # 3
    "PT006",  # 2
    "RUF001",  # 14
    "E402",  # 1
]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "PLR2004", "PT018", "PLR0913", "PLR0912", "PLR0917", "PT006", "RUF001", "E402"]

[lint.per-file-ignores]
"**/vulture_whitelist.py" = ["B018", "F821"]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]

[format]
quote-style = "double"
