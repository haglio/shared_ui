# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: "app_support"
      python-version: "3.12"
      timeout-minutes: 3
      qt-platform: offscreen

  # A consumer built against the candidate. This repo's own suite is the only
  # thing that has ever gated it, so a change here could merge green and turn a
  # consumer red later with no cause in that consumer's own history. promptcrafter
  # is the cheapest repo that actually paints these widgets.
  consumer:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      repo: promptcrafter
      siblings: "app_support"
      python-version: "3.12"
      timeout-minutes: 6
      qt-platform: offscreen
      reverse: false

  # What the machine this is developed on would say. It runs 3.14 and the gate
  # runs 3.12, and the two evaluate annotations differently (PEP 649), so a
  # branch can be green here and fail to collect there. On `push` only: never on
  # a pull request and never in the queue, so this reads without gating and
  # nothing here can hold up a landing.
  next-python:
    if: github.event_name == 'push'
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: "app_support"
      python-version: "3.14"
      timeout-minutes: 3
      qt-platform: offscreen
      reverse: false
