# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No siblings cloned: app_support is pinned in pyproject, so pip fetches the
  # tag this repo was built against. A clone here would install whatever main
  # held this minute and pip would replace it with the pin anyway.
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: ""
      python-version: "3.14"
      timeout-minutes: 3
      qt-platform: offscreen

  # A consumer built against the candidate. This repo's own suite is the only
  # thing that has ever gated it, so a change here could merge green and turn a
  # consumer red later with no cause in that consumer's own history. promptcrafter
  # is the cheapest repo that actually paints these widgets.
  consumer:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      repo: promptcrafter
      siblings: "app_support"
      python-version: "3.14"
      timeout-minutes: 6
      qt-platform: offscreen

  # A version for each landing, so the repos that run this one can pin the copy
  # they were built against. The tag is the version: pyproject reads it with
  # setuptools-scm.
  tag:
    if: github.event_name == 'push'
    needs: full-suite
    uses: haglio/.github/.github/workflows/tag-the-landing.yml@main
    permissions:
      contents: write
