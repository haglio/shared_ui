name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# windows-latest: shared_ui is the Qt widget/token library the family's Windows
# apps build on, so its suite is validated on the platform it ships to. The Qt
# tests render real widgets, so they need a headless display -- QT_QPA_PLATFORM=
# offscreen supplies one on the runner. The package sits in a shared_ui/ subdir
# under the repo root (like the rest of the app family), so a plain editable
# install maps the import name correctly; compat mode keeps it a clean wheel-based
# editable that does not scatter .egg-info build metadata into the tree.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: windows-latest
    # About three times a green run, so it can only fire on a hang. A green job
    # is roughly 40 s of checkout and install plus two ~7 s suite legs, so ~54 s;
    # without this the queue's required check would sit on a hung run until
    # GitHub's six-hour default and print nothing that named it.
    timeout-minutes: 3
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, compat mode)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --config-settings editable_mode=compat
      - name: Run the suite
        run: python -m pytest -q
      # Again, back to front. Six repos import this package, so a test here that
      # leans on the one beside it is a guard that is not guarding -- and the
      # Qt-isolation probe was reading whichever shared_ui the subprocess found
      # rather than the tree under test. Reversing inverts every "this runs
      # before that" the suite has, so the next such lean goes red on the commit
      # that introduces it. TEST_COLLECTION_ORDER=shuffle with
      # TEST_COLLECTION_SEED is the deeper local check (see tests/conftest.py);
      # the gate takes the deterministic one.
      - name: Run the suite back to front
        env:
          TEST_COLLECTION_ORDER: reverse
        run: python -m pytest -q
